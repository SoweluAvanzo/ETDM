name: Validate ETDM schema and example
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'lxml>=6.0'
      - name: Compile schema and validate the Circles model
        run: |
          python - <<'PY'
          from lxml import etree
          parser = etree.XMLParser(resolve_entities=False, no_network=True)
          schema = etree.XMLSchema(etree.parse('XSD_ETDM_TE.xsd', parser))
          schema.assertValid(etree.parse('ETDM_CIrclesDAO_ETDM_diagram.xml', parser))
          print('ETDM schema compiles and the Circles model validates')
          PY
